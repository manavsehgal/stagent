name: Relay Host contract

on:
  pull_request:
    paths:
      - ".github/workflows/relay-host-contract.yml"
      - ".dockerignore"
      - "Dockerfile.relay-host"
      - "config/install-dependency-debt.json"
      - "config/relay-host-artifact-policy.json"
      - "next.config.mjs"
      - "package.json"
      - "package-lock.json"
      - "scripts/**relay-host*"
      - "scripts/check-install-dependency-debt.mjs"
      - "src/**"
      - "public/**"
      - "knowledge/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      # fetch-depth: 0 because the reproduction smoke resolves a prior release
      # ref out of ordinary history. The default depth-1 checkout fetches no
      # tags and no history, so that lookup fails with "not a valid object
      # name" before any build starts. publish-relay-cell.yml already checks
      # out this way for the same reason.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # The artifact build exports OCI archives (type=oci). The stock docker
      # driver cannot do that, so without a buildx builder the export fails
      # with "OCI exporter is not supported for the docker driver" on any
      # runner without the containerd image store. Same action and pin as
      # publish-relay-cell.yml, which provisions one for the same build.
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.1
          cache: npm
      - run: npm ci
      - run: npm run check:install-debt
      - run: npm run test:relay-host
      - name: Build, audit, reproduce and conformance-test the Host artifact
        run: npm run host:artifact:build
